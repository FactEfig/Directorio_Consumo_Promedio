<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Buscador por Número</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f7f7fb; }
    .card { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
    .result-ok { border-left: 5px solid #28a745; }
    .result-none { border-left: 5px solid #dc3545; }
    .small-muted { font-size:.9rem; color:#6c757d; }
    .footer { font-size:.85rem; color:#6c757d; }
  </style>
</head>
<body>
  <div class="container py-4">
    <header class="mb-4">
      <h1 class="h5 text-center">Buscador público por número</h1>
      <p class="text-center small-muted">Escribe el número exacto para consultar la información publicada.</p>
    </header>

    <div class="card p-3 mb-3">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md">
          <label for="numeroInput" class="form-label">Número</label>
          <input type="text" inputmode="numeric" pattern="[0-9]*" class="form-control" id="numeroInput" placeholder="Ej: 1001">
        </div>
        <div class="col-12 col-md-auto">
          <button id="btnBuscar" class="btn btn-primary w-100">Buscar</button>
        </div>
      </div>
      <div class="form-text">También puedes presionar Enter para buscar.</div>
    </div>

    <div id="resultado"></div>

    <footer class="footer mt-4 text-center">
      <span>© 2025 – Buscador público • Optimizado para celulares</span>
    </footer>
  </div>

  <script>
    // URL del JSON público (puede ser data.json local o una URL de GitHub Pages/Netlify)
    const DATA_URL = 'data.json';

    let tabla = [];

    async function cargarDatos() {
      try {
        const resp = await fetch(DATA_URL, { cache: 'no-store' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        tabla = await resp.json();
      } catch (e) {
        console.error('Error cargando datos', e);
        mostrarError('No se pudo cargar la tabla pública. Verifica la URL del JSON y que sea accesible sin autenticación.');
      }
    }

    function mostrarResultado(registro) {
      const cont = document.getElementById('resultado');
      cont.innerHTML = '';
      if (!registro) {
        cont.innerHTML = `
          <div class="card p-3 result-none">
            <h2 class="h6 mb-2">Sin coincidencias</h2>
            <p>No encontramos ese número. Verifica si está bien escrito.</p>
          </div>`;
        return;
      }
      cont.innerHTML = `
        <div class="card p-3 result-ok">
          <h2 class="h6 mb-3">Resultado</h2>
          <div class="table-responsive">
            <table class="table table-sm">
              <tbody>
                <tr><th>Número</th><td>${registro.numero}</td></tr>
                <tr><th>Cliente</th><td>${registro.cliente ?? '-'}</td></tr>
                <tr><th>Estado</th><td>${registro.estado ?? '-'}</td></tr>
                <tr><th>Fecha</th><td>${registro.fecha ?? '-'}</td></tr>
                <tr><th>Monto</th><td>${registro.monto?.toLocaleString('es-CO') ?? '-'}</td></tr>
              </tbody>
            </table>
          </div>
        </div>`;
    }

    function mostrarError(msg) {
      const cont = document.getElementById('resultado');
      cont.innerHTML = `
        <div class="card p-3 result-none">
          <h2 class="h6 mb-2">Error</h2>
          <p>${msg}</p>
        </div>`;
    }

    function buscarPorNumero(num) {
      if (!tabla || tabla.length === 0) {
        mostrarError('La tabla aún no está cargada. Intenta de nuevo en unos segundos.');
        return;
      }
      const n = String(num).trim();
      const registro = tabla.find(r => String(r.numero).trim() === n);
      mostrarResultado(registro || null);
    }

    document.getElementById('btnBuscar').addEventListener('click', () => {
      const num = document.getElementById('numeroInput').value;
      buscarPorNumero(num);
    });

    document.getElementById('numeroInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        buscarPorNumero(e.target.value);
      }
    });

    cargarDatos();
  </script>
</body>
</html>
