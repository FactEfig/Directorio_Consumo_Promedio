<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Buscador por Contrato o Ciclo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f7f7fb; }
    .card { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
    .result-ok { border-left: 5px solid #28a745; }
    .result-none { border-left: 5px solid #dc3545; }
    .small-muted { font-size:.9rem; color:#6c757d; }
    .footer { font-size:.85rem; color:#6c757d; }
    table.table td, table.table th { vertical-align: middle; }
  </style>
</head>
<body>
  <div class="container py-4">
    <header class="mb-4">
      <h1 class="h5 text-center">Buscador público por Contrato o Ciclo</h1>
      <p class="text-center small-muted">Búsqueda exacta. Contrato devuelve un único registro; Ciclo puede devolver múltiples contratos.</p>
    </header>

    <div class="card p-3 mb-3">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md-4">
          <label for="modoSelect" class="form-label">Buscar por</label>
          <select id="modoSelect" class="form-select">
            <option value="Contrato" selected>Contrato</option>
            <option value="Ciclo">Ciclo</option>
          </select>
        </div>
        <div class="col-12 col-md">
          <label for="valorInput" class="form-label">Número</label>
          <input type="text" inputmode="numeric" pattern="[0-9]*" class="form-control" id="valorInput" placeholder="Ej: 1336314 o 6307">
        </div>
        <div class="col-12 col-md-auto">
          <button id="btnBuscar" class="btn btn-primary w-100">Buscar</button>
        </div>
      </div>
      <div class="form-text">Presiona Enter para buscar.</div>
    </div>

    <div id="resultado"></div>

    <footer class="footer mt-4 text-center">
      <span>© 2025 – Buscador público • Optimizado para celulares</span>
    </footer>
  </div>

  <script>
    const DATA_URL = 'data.json';
    let tabla = [];

    async function cargarDatos() {
      try {
        const resp = await fetch(DATA_URL, { cache: 'no-store' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        tabla = await resp.json();
      } catch (e) {
        console.error('Error cargando datos', e);
        mostrarError('No se pudo cargar la tabla pública. Verifica la URL del JSON.');
      }
    }

    function mostrarContrato(rec) {
      const cont = document.getElementById('resultado');
      cont.innerHTML = '';
      if (!rec) {
        cont.innerHTML = `
          <div class="card p-3 result-none">
            <h2 class="h6 mb-2">Sin coincidencias</h2>
            <p>No encontramos ese contrato.</p>
          </div>`;
        return;
      }
      cont.innerHTML = `
        <div class="card p-3 result-ok">
          <h2 class="h6 mb-3">Resultado</h2>
          <div class="table-responsive">
            <table class="table table-sm">
              <tbody>
                <tr><th>Contrato</th><td>${rec.Contrato}</td></tr>
                <tr><th>Ciclo</th><td>${rec.Ciclo || '-'}</td></tr>
                <tr><th>Dirección</th><td>${rec.Direccion || '-'}</td></tr>
                <tr><th>Teléfono</th><td>${rec.Telefono || '-'}</td></tr>
                <tr><th>Observación</th><td>${rec.Observacion || '-'}</td></tr>
              </tbody>
            </table>
          </div>
        </div>`;
    }

    function mostrarCiclo(recs) {
      const cont = document.getElementById('resultado');
      cont.innerHTML = '';
      if (!recs || recs.length === 0) {
        cont.innerHTML = `
          <div class="card p-3 result-none">
            <h2 class="h6 mb-2">Sin coincidencias</h2>
            <p>No encontramos contratos para ese ciclo.</p>
          </div>`;
        return;
      }
      const filas = recs.map(r => `
        <tr>
          <td>${r.Contrato}</td>
          <td>${r.Ciclo || '-'}</td>
          <td>${r.Direccion || '-'}</td>
          <td>${r.Telefono || '-'}</td>
          <td>${r.Observacion || '-'}</td>
        </tr>
      `).join('');
      cont.innerHTML = `
        <div class="card p-3 result-ok">
          <h2 class="h6 mb-3">Contratos del ciclo</h2>
          <div class="table-responsive">
            <table class="table table-sm">
              <thead>
                <tr>
                  <th>Contrato</th>
                  <th>Ciclo</th>
                  <th>Dirección</th>
                  <th>Teléfono</th>
                  <th>Observación</th>
                </tr>
              </thead>
              <tbody>
                ${filas}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    function mostrarError(msg) {
      const cont = document.getElementById('resultado');
      cont.innerHTML = `
        <div class="card p-3 result-none">
          <h2 class="h6 mb-2">Error</h2>
          <p>${msg}</p>
        </div>`;
    }

    function buscar() {
      if (!tabla || tabla.length === 0) {
        mostrarError('La tabla aún no está cargada. Intenta de nuevo en unos segundos.');
        return;
      }
      const modo = document.getElementById('modoSelect').value;
      const valor = String(document.getElementById('valorInput').value).trim();
      if (!valor) {
        mostrarError('Ingresa un número para buscar.');
        return;
      }
      if (modo === 'Contrato') {
        const rec = tabla.find(r => String(r.Contrato).trim() === valor);
        mostrarContrato(rec || null);
      } else {
        const recs = tabla.filter(r => String(r.Ciclo).trim() === valor);
        mostrarCiclo(recs);
      }
    }

    document.getElementById('btnBuscar').addEventListener('click', buscar);
    document.getElementById('valorInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') buscar();
    });

    cargarDatos();
  </script>
</body>
</html>
